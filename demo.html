<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Tourismus-Radar & POI-Verwaltung</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <!-- Leaflet LocateControl CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.locatecontrol@0.79.0/dist/L.Control.Locate.min.css" />

  <link rel="stylesheet" href="styles.css">
  
</head>
<body>
  <div class="app-container">
    <div id="map"></div>

    <section class="info-panel" aria-live="polite">
      <div class="panel-header">
        <!-- Тексты удалены для компактности -->
        <span id="gps-status" class="status-badge" style="margin-left: auto;">
          <span class="status-dot"></span>
          <span id="gps-status-text" style="display: none;">GPS inaktiv</span>
        </span>
      </div>

      <div class="poi-content">
        <div class="poi-details">
          <button id="nearest-name-btn" class="poi-title-btn" title="Klicken, um zum POI zu zoomen">Standort wird ermittelt…</button>
          <div id="nearest-meta" class="poi-subtitle">Bitte GPS aktivieren oder Standortfreigabe erlauben</div>
        </div>

        <div class="distance-box">
          <div id="nearest-distance" class="distance-value">–</div>
          <div class="distance-label">Luftlinie</div>
        </div>
      </div>

      <!-- Компактный футер: чекбокс "Besucht" и свитчер сторон на одной линии -->
      <div class="panel-footer-row" style="display: flex; align-items: center; justify-content: space-between; gap: 8px;">
        <label class="visited-checkbox-label" style="display: flex; align-items: center; gap: 6px; font-size: 0.8rem; cursor: pointer;">
          <input type="checkbox" id="nearest-visited-checkbox" />
          <span>Besucht</span>
        </label>
        <span id="visited-status-badge" style="font-size: 0.75rem; color: var(--success); font-weight: 600; display: none;">✓ Besucht</span>

        <!-- Компактный селектор стороны -->
        <div style="display: flex; align-items: center; gap: 4px; font-size: 0.8rem;">
          <select id="side-selector" style="padding: 2px 4px; border-radius: 4px; border: 1px solid #ccc; font-size: 0.75rem; cursor: pointer;">
            <option value="both">Beide</option>
            <option value="right">Rechts</option>
            <option value="left">Links</option>
          </select>
        </div>
      </div>

      <!-- DEMO-STEUERUNG & GESCHWINDIGKEIT -->
      <div style="margin-top: 10px; padding-top: 8px; border-top: 1px solid rgba(0,0,0,0.1);">
        <button id="toggle-demo-btn" style="width: 100%; padding: 8px; background: #E69F00; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.85rem; transition: background 0.2s;">
          🚆 RE 5 Demo starten
        </button>
        
        <div style="margin-top: 6px; display: flex; align-items: center; justify-content: space-between; font-size: 0.8rem;">
          <label style="cursor: pointer; display: flex; align-items: center; gap: 6px; user-select: none;">
            <input type="checkbox" id="follow-train-checkbox" checked />
            Kamera folgen (panTo)
          </label>
        </div>

        <!-- Регулятор скорости до 300 км/ч -->
        <div style="margin-top: 6px; font-size: 0.8rem;">
          <div style="display: flex; justify-content: space-between; margin-bottom: 2px;">
            <span>Geschwindigkeit: <strong id="speed-value">100</strong> km/h</span>
          </div>
          <input type="range" id="train-speed-range" min="50" max="300" step="10" value="100" style="width: 100%; cursor: pointer;" />
        </div>
      </div>
    </section>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <!-- Leaflet LocateControl JS -->
  <script src="https://cdn.jsdelivr.net/npm/leaflet.locatecontrol@0.79.0/dist/L.Control.Locate.min.js"></script>
  <!-- Proj4js für Koordinatentransformation (EPSG:25832 -> WGS84) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.11.0/proj4.js"></script>

  <script src="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.0.17/leaflet-maplibre-gl.js"></script>

  <script>
    proj4.defs("EPSG:25832", "+proj=utm +zone=32 +ellps=GRS80 +towgs84=0,0,0,0,0,0,0 +units=m +no_defs +type=crs");

    const STORAGE_KEY = "tourismus_pois_visited_v1";
    let visitedStore = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};

    var map = L.map('map', {
       minZoom: 6,
       maxZoom: 15,
    }).setView([51.22, 6.77], 8);

    var topographicLayer = L.maplibreGL({
       style: 'https://sgx.geodatenzentrum.de/gdz_basemapde_vektor/styles/bm_web_top.json',
    });

    var hellLayer = L.maplibreGL({
       style: 'https://basemap.de/data/produkte/web_vektor/styles/bm_web_bin.json',
    });

    var dunkelLayer = L.maplibreGL({
       style: 'https://sgx.geodatenzentrum.de/gdz_basemapde_vektor/styles/bm_web_drk.json',
    });

    hellLayer.addTo(map);

    var baseMaps = {
      "Topographisch": topographicLayer,
      "Dunkel": dunkelLayer,
      "Hell": hellLayer
    };

    L.control.layers(baseMaps, null, { position: 'topright', collapsed: true }).addTo(map);

    let poiList = [];
    let nearestLine = null;
    let currentNearestMarker = null;
    let currentNearestPoi = null;

    let routeCoordinates = []; 
    let demoMarker = null;       
    let demoInterval = null;     
    let isDemoActive = false;
    let routeLayer = null;
    let currentRouteIndex = 0;
    let currentTrainSpeed = 100;
    let lastUserLat = null;
    let lastUserLon = null;

    let activePoiLayer = L.layerGroup().addTo(map);
    const MAX_RENDER_RADIUS_METERS = 6000; // 6 km Puffer

    function calculateHaversineDistance(lat1, lon1, lat2, lon2) {
      const R = 6371000;
      const toRad = (deg) => (deg * Math.PI) / 180;
      const dLat = toRad(lat2 - lat1);
      const dLon = toRad(lon2 - lon1);
      const a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
        Math.sin(dLon / 2) * Math.sin(dLon / 2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function formatDistance(meters) {
      if (meters < 1000) return `${Math.round(meters)} m`;
      return `${(meters / 1000).toFixed(2).replace(".", ",")} km`;
    }

    function toWGS84(coords) {
      const [x, y] = coords;
      if (Math.abs(x) > 180 || Math.abs(y) > 90) {
        const [lon, lat] = proj4("EPSG:25832", "EPSG:4326", [x, y]);
        return { lat, lon };
      }
      return { lat: y, lon: x };
    }

    function getPoiId(poi) {
      return `${poi.name}_${poi.lat}_${poi.lon}`;
    }

    function createPoiIcon(isNearest = false, isVisited = false) {
      const size = isNearest ? 16 : 12;
      let className = "poi-marker-pin";
      if (isNearest) className += " nearest";
      if (isVisited) className += " visited-marker";

      return L.divIcon({
        className: className,
        iconSize: [size, size],
        iconAnchor: [size / 2, size / 2],
        popupAnchor: [0, -size / 2]
      });
    }

    async function loadGeoJsonData() {
      try {
        const response = await fetch("POIs_puffer2km.geojson");
        if (!response.ok) throw new Error(`HTTP-Fehler: ${response.status}`);
        const geojsonData = await response.json();

        geojsonData.features.forEach((feature) => {
          if (!feature.geometry || feature.geometry.type !== "Point") return;
          const { lat, lon } = toWGS84(feature.geometry.coordinates);
          const props = feature.properties || {};
          const name = props.Name_ReprO || props.Name_Bestt || props.name || "Unbekannter POI";
          const welterbe = props.Name_WeltE || "";
          const ort = [props.PLZ, props.Ort].filter(Boolean).join(" ");
          const typ = props.Typ || props.Art || "";
          const homepage = props.Homepage ? (props.Homepage.startsWith("http") ? props.Homepage : `https://${props.Homepage}`) : null;

          poiList.push({ name, welterbe, ort, typ, homepage, lat, lon, marker: null });
        });
        console.log(`${poiList.length} POIs geladen.`);
      } catch (error) {
        console.error("Fehler beim Laden der POIs:", error);
      }
    }

    async function loadRouteGeoJson() {
      try {
        const response = await fetch("wesel_coblenz_re5.geojson");
        if (!response.ok) throw new Error(`HTTP-Fehler: ${response.status}`);
        const data = await response.json();

        routeLayer = L.geoJSON(data, {
          style: { color: "#2563eb", weight: 4, opacity: 0.8 }
        }).addTo(map);

        data.features.forEach((feature) => {
          if (!feature.geometry) return;
          const coords = feature.geometry.coordinates;

          if (feature.geometry.type === "LineString") {
            coords.forEach(coord => {
              const { lat, lon } = toWGS84(coord);
              routeCoordinates.push([lat, lon]);
            });
          } else if (feature.geometry.type === "MultiLineString") {
            coords.forEach(line => {
              line.forEach(coord => {
                const { lat, lon } = toWGS84(coord);
                routeCoordinates.push([lat, lon]);
              });
            });
          }
        });
        console.log(`Route RE 5 geladen: ${routeCoordinates.length} Punkte.`);
      } catch (error) {
        console.warn("Konnte wesel_coblenz_re5.geojson nicht laden. Verwende Fallback-Route.", error);
        routeCoordinates = [
          [51.6585, 6.6194], [51.55, 6.75], [51.43, 6.76], 
          [51.22, 6.77], [50.93, 6.95], [50.73, 7.09], [50.35, 7.59]
        ];
      }
    }

    function setPoiVisited(poi, isVisited) {
      const poiId = getPoiId(poi);
      if (isVisited) visitedStore[poiId] = true;
      else delete visitedStore[poiId];
      localStorage.setItem(STORAGE_KEY, JSON.stringify(visitedStore));

      const isCurrentNearest = (currentNearestPoi && getPoiId(currentNearestPoi) === poiId);
      if (poi.marker) poi.marker.setIcon(createPoiIcon(isCurrentNearest, isVisited));
      if (isCurrentNearest) updatePanelVisitedState(isVisited);
    }

    function updatePanelVisitedState(isVisited) {
      const nameBtn = document.getElementById("nearest-name-btn");
      const checkbox = document.getElementById("nearest-visited-checkbox");
      const badge = document.getElementById("visited-status-badge");

      checkbox.checked = isVisited;
      if (isVisited) {
        nameBtn.classList.add("visited");
        badge.style.display = "inline";
      } else {
        nameBtn.classList.remove("visited");
        badge.style.display = "none";
      }
    }

    function createPopupContent(poi) {
      const poiId = getPoiId(poi);
      const isVisited = !!visitedStore[poiId];
      const popupContent = document.createElement("div");
      popupContent.innerHTML = `
        <div class="popup-title">${poi.name}</div>
        ${poi.welterbe && poi.welterbe !== poi.name ? `<div class="popup-meta"><strong>Welterbe:</strong> ${poi.welterbe}</div>` : ""}
        ${poi.ort ? `<div class="popup-meta"><strong>Ort:</strong> ${poi.ort}</div>` : ""}
        ${poi.typ ? `<div class="popup-meta"><strong>Kategorie:</strong> ${poi.typ}</div>` : ""}
        <div class="popup-actions">
          ${poi.homepage ? `<a class="popup-link" href="${poi.homepage}" target="_blank" rel="noopener">Website öffnen &rarr;</a>` : ""}
          <a class="map-nav-btn" href="https://www.google.com/maps/search/?api=1&query=${poi.lat},${poi.lon}" target="_blank" rel="noopener">In Google Maps öffnen &nearr;</a>
          <label style="display: flex; align-items: center; gap: 6px; font-size: 0.8rem; margin-top: 4px; cursor: pointer;">
            <input type="checkbox" class="popup-visited-cb" ${isVisited ? "checked" : ""} />
            <span>Besucht</span>
          </label>
        </div>
      `;
      popupContent.querySelector(".popup-visited-cb").addEventListener("change", (e) => {
        setPoiVisited(poi, e.target.checked);
      });
      return popupContent;
    }

    function isPoiOnSelectedSide(userLat, userLon, nextLat, nextLon, poiLat, poiLon, sideOption) {
      if (sideOption === "both") return true;

      const dLat = nextLat - userLat;
      const dLon = nextLon - userLon;
      const pLat = poiLat - userLat;
      const pLon = poiLon - userLon;

      const crossProduct = dLat * pLon - dLon * pLat;

      if (sideOption === "right") {
        return crossProduct < 0;
      } else if (sideOption === "left") {
        return crossProduct > 0;
      }
      return true;
    }

    function updateNearestPOI(userLat, userLon) {
      if (poiList.length === 0) return;

      lastUserLat = userLat;
      lastUserLon = userLon;

      const sideOption = document.getElementById("side-selector").value;

      let nextLat = userLat + 0.001;
      let nextLon = userLon + 0.001;
      if (isDemoActive && routeCoordinates.length > 0) {
        const nextIndex = (currentRouteIndex < routeCoordinates.length) ? currentRouteIndex : 0;
        nextLat = routeCoordinates[nextIndex][0];
        nextLon = routeCoordinates[nextIndex][1];
      }

      let closestPoi = null;
      let minDistance = Infinity;

      for (const poi of poiList) {
        const dist = calculateHaversineDistance(userLat, userLon, poi.lat, poi.lon);
        if (dist <= MAX_RENDER_RADIUS_METERS) {
          if (isPoiOnSelectedSide(userLat, userLon, nextLat, nextLon, poi.lat, poi.lon, sideOption)) {
            if (dist < minDistance) {
              minDistance = dist;
              closestPoi = poi;
            }
          }
        }
      }

      const nameBtn = document.getElementById("nearest-name-btn");
      const metaDiv = document.getElementById("nearest-meta");
      const distDiv = document.getElementById("nearest-distance");

      if (!closestPoi) {
        nameBtn.textContent = "Keine POIs in diesem Bereich";
        metaDiv.textContent = "Bitte Puffer oder Seite anpassen";
        distDiv.textContent = "–";
        currentNearestPoi = null;
        activePoiLayer.clearLayers();
        if (nearestLine) map.removeLayer(nearestLine);
        return;
      }

      currentNearestPoi = closestPoi;

      nameBtn.textContent = closestPoi.name;
      const subParts = [closestPoi.ort, closestPoi.typ].filter(Boolean);
      metaDiv.textContent = subParts.length > 0 ? subParts.join(" • ") : "Tourismus-POI";
      distDiv.textContent = formatDistance(minDistance);

      updatePanelVisitedState(!!visitedStore[getPoiId(closestPoi)]);

      activePoiLayer.clearLayers();
      poiList.forEach((poi) => {
        const distToUser = calculateHaversineDistance(userLat, userLon, poi.lat, poi.lon);
        if (distToUser <= MAX_RENDER_RADIUS_METERS) {
          if (isPoiOnSelectedSide(userLat, userLon, nextLat, nextLon, poi.lat, poi.lon, sideOption)) {
            const isThisNearest = (poi === closestPoi);
            const marker = L.marker([poi.lat, poi.lon], { 
              icon: createPoiIcon(isThisNearest, !!visitedStore[getPoiId(poi)]) 
            }).bindPopup(createPopupContent(poi));
            poi.marker = marker;
            activePoiLayer.addLayer(marker);
            if (isThisNearest) currentNearestMarker = marker;
          } else {
            poi.marker = null;
          }
        } else {
          poi.marker = null;
        }
      });

      if (!closestPoi.marker || !activePoiLayer.hasLayer(closestPoi.marker)) {
        const nearestVisited = !!visitedStore[getPoiId(closestPoi)];
        const marker = L.marker([closestPoi.lat, closestPoi.lon], { 
          icon: createPoiIcon(true, nearestVisited) 
        }).bindPopup(createPopupContent(closestPoi));
        closestPoi.marker = marker;
        activePoiLayer.addLayer(marker);
        currentNearestMarker = marker;
      }

      if (nearestLine) map.removeLayer(nearestLine);
      nearestLine = L.polyline(
        [[userLat, userLon], [closestPoi.lat, closestPoi.lon]],
        { color: "#dc2626", weight: 2.5, dashArray: "6, 8", opacity: 0.85 }
      ).addTo(map);
    }

    function getIntervalFromSpeed(speedKmh) {
      return Math.max(100, Math.round(1200 * (100 / speedKmh)));
    }

    function restartDemoInterval() {
      if (!isDemoActive) return;
      if (demoInterval) clearInterval(demoInterval);

      const intervalMs = getIntervalFromSpeed(currentTrainSpeed);

      demoInterval = setInterval(() => {
        if (currentRouteIndex >= routeCoordinates.length) {
          currentRouteIndex = 0;
        }

        const currentLatLng = routeCoordinates[currentRouteIndex];
        demoMarker.setLatLng(currentLatLng);

        const followCheckbox = document.getElementById("follow-train-checkbox");
        if (followCheckbox && followCheckbox.checked) {
          map.panTo(currentLatLng, { animate: true, duration: intervalMs / 1000 * 0.9 });
        }

        updateNearestPOI(currentLatLng[0], currentLatLng[1]);
        currentRouteIndex++;
      }, intervalMs);
    }

    function startDemoRide() {
      if (routeCoordinates.length === 0) {
        alert("Keine Route verfügbar!");
        return;
      }

      isDemoActive = true;
      currentRouteIndex = 0;

      if (locateControl && locateControl._active) locateControl.stop();

      if (!demoMarker) {
        const trainIcon = L.divIcon({
          className: 'demo-train-marker',
          html: '<div style="background: #1e3a8a; width: 20px; height: 20px; border-radius: 50%; border: 3px solid white; box-shadow: 0 0 10px rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; font-size: 10px; color: white;">🚆</div>',
          iconSize: [20, 20],
          iconAnchor: [10, 10]
        });
        demoMarker = L.marker(routeCoordinates[0], { icon: trainIcon }).addTo(map);
      } else {
        demoMarker.setLatLng(routeCoordinates[0]);
        demoMarker.addTo(map);
      }

      document.getElementById("gps-status").classList.add("active");
      restartDemoInterval();
    }

    function stopDemoRide() {
      isDemoActive = false;
      if (demoInterval) {
        clearInterval(demoInterval);
        demoInterval = null;
      }
      if (demoMarker) map.removeLayer(demoMarker);
      document.getElementById("gps-status").classList.remove("active");
    }

    document.getElementById("train-speed-range").addEventListener("input", (e) => {
      currentTrainSpeed = parseInt(e.target.value, 10);
      document.getElementById("speed-value").textContent = currentTrainSpeed;
      if (isDemoActive) restartDemoInterval();
    });

    document.getElementById("side-selector").addEventListener("change", () => {
      if (lastUserLat !== null && lastUserLon !== null) {
        updateNearestPOI(lastUserLat, lastUserLon);
      }
    });

    document.getElementById("nearest-name-btn").addEventListener("click", () => {
      if (!currentNearestPoi) return;
      map.flyTo([currentNearestPoi.lat, currentNearestPoi.lon], 16, { animate: true, duration: 1.2 });
      if (currentNearestPoi.marker) currentNearestPoi.marker.openPopup();
    });

    document.getElementById("nearest-visited-checkbox").addEventListener("change", (e) => {
      if (!currentNearestPoi) return;
      setPoiVisited(currentNearestPoi, e.target.checked);
    });

    document.getElementById("toggle-demo-btn").addEventListener("click", () => {
      const btn = document.getElementById("toggle-demo-btn");
      if (!isDemoActive) {
        startDemoRide();
        btn.textContent = "⏹ RE 5 Demo stoppen";
        btn.style.background = "#dc2626";
      } else {
        stopDemoRide();
        btn.textContent = "🚆 RE 5 Demo starten";
        btn.style.background = "#E69F00";
      }
    });

    const locateControl = L.control.locate({
      position: "topleft",
      flyTo: true,
      keepCurrentZoomLevel: false,
      initialZoomLevel: 13,
      watch: true,
      enableHighAccuracy: true,
      strings: { title: "Meinen Standort anzeigen" }
    }).addTo(map);

    map.on("locationfound", (e) => {
      if (isDemoActive) return;
      document.getElementById("gps-status").classList.add("active");
      updateNearestPOI(e.latlng.lat, e.latlng.lng);
    });

    map.on("locationerror", () => {
      if (isDemoActive) return;
      document.getElementById("gps-status").classList.remove("active");
    });

    Promise.all([
      loadGeoJsonData(),
      loadRouteGeoJson()
    ]).then(() => {
      locateControl.start();
    });
  </script>
</body>
</html>
